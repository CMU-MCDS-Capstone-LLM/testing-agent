additional_instructions: "Only mock external dependencies; never patch functions or\
  \ classes defined inside the source file under test.\nLet the real implementation\
  \ run; patch file, network, or database I/O only when necessary, and patch each\
  \ target (for example, builtins.open) once per test.\n\nWhen you need path-like\
  \ objects, prefer real Path(...) instances. If you must mock path.joinpath(), assign\
  \ a Mock to the return value and configure is_file() and suffix instead of chaining\
  \ return_value assignments.\n\nImport helpers from the source module directly (e.g.,\
  \ from convert import open_note, write_or_append_note, convert, run_parser) and\
  \ call them by name. Avoid patterns such as convert.convert(...).\nIf the production\
  \ code filters resources (Path.iterdir, os.listdir, etc.), configure mocks so the\
  \ predicates remain true\u2014return objects where is_file() is True and suffix\
  \ equals '.json'.\nWhenever you mock domain objects (Notes, etc.), set every attribute\
  \ or method that the production code touches, or build real instances via project\
  \ utilities.\n\nFocus on uncovered lines from the latest coverage report. Skip tests\
  \ that would only exercise code that already has non-zero hits.\n\nGenerate normal\
  \ (happy-path) scenarios first, but fulfil the mandatory exception-path test above\
  \ whenever those lines are uncovered.\nEnsure each proposed test adds new line or\
  \ branch coverage; skip any test that duplicates existing behavior.\n"
